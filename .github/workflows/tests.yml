name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, intl, dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer dump-autoload --optimize --strict-psr
      - run: composer test -- --compact

  symbols-without-intl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: 'bcmath, :intl'
          tools: composer:v2
          coverage: none
      - run: composer install --no-dev --no-plugins --no-scripts --no-interaction --prefer-dist
      - run: php tests/fixtures/currency-symbols-without-intl.php
